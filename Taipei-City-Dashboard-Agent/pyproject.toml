[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youth-agent"
version = "0.1.0"
description = "PydanticAI agent service for New Taipei City Youth Dashboard"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-ai[bedrock]>=0.1",
    "pydantic-settings>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]",
    "asyncpg>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[project.scripts]
youth-agent = "youth_agent.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/youth_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# 城市儀表板資料目錄
#
# 這份檔案是「防幻覺」的白名單，同時是 LLM prompt 的 grounding 來源。
# 只有列在這裡的資料表與欄位，才允許出現在 ComponentSpec 裡。
#
# 為什麼非有不可：本專案的欄位叫 percent2 ~ percent33，**名稱完全沒有語意**。
# 模型只看 information_schema 不可能知道 percent7 是 20-24 歲。沒有這份對照，
# 生出來的組件會是「語法正確但意義錯誤」——最難發現的一種錯。
#
# 對照關係全部以實際資料驗算過（2025 年、臺北市總計）：
#   percent3..percent23 加總 = percent2（總人口）
#   percent6..percent15  加總 = percent26（15-64 歲）
#   percent24+percent26+percent28 = percent2
#   percent33 = percent28 / percent24 * 100（老化指數）
#
# 刻意不收錄：
#   1. 顏色 —— 由 component_charts.color 指定，模型無從干預
#   2. 未驗證語意的欄位 —— 寧可少列，多列一個就是在驗證器上開一個洞

catalog_version: "1"
verified_on: "2026-09-09"
verified_against: "本機 dashboard 資料庫，臺北市 2025 年總計列"

# 各 type 允許的聚合方式。validator 以此檢查欄位型別與用法是否相容。
agg_rules:
  count:   [sum, avg, min, max]      # 人數，可加總
  ratio:   [avg, min, max]           # 百分比／指數，**不可加總**
  year:    [group]
  category: [group]

tables:

  city_age_distribution_newtaipei:
    label: 新北市現住人口年齡分配
    city: metrotaipei
    grain: 一列 = 一個行政區 × 一年 × 一種統計類型
    source: 新北市主計處
    note: >-
      合計列的「區域別」是「新北市」（臺北那張表是「總計」），做分區圖時
      務必排除，否則合計會被當成一個行政區畫進去。
    # 官方已經用這批資料做過的組件（以 index 對照）。
    # 生成前會查這個清單，告訴使用者「官方已經有了、而且是什麼視角」，
    # 而不是默默生一個重複的。用人工標而不是字串比對，是因為
    # 「老化指數」vs「屋齡分布」這種字面接近但語意無關的情況，比對會誤判。
    related_official_components:
      - city_age_distribution    # 全市年齡分區
      - dependency_aging         # 扶養比及老化指數
    fields:
      年份:
        type: year
        label: 年份（西元）
        groupable: true
      區域別:
        type: category
        label: 行政區
        groupable: true
        note: 含合計列，見上方 note
      統計類型:
        type: category
        label: 性別
        groupable: true
        # values 不只是文件——validateSpec 會拿它比對數列標籤，
        # 抓「標籤寫女性、篩選卻是計」這種名實不符的組件。
        values: ["計", "男", "女"]
        neutral_value: "計"
        note: >-
          值為 計／男／女。問題沒有提到性別時固定篩選「計」。
          要做男女對照時，不要放進 filters（那樣整張圖只會有一個性別），
          而是讓每個數列各自帶 filter，例如
          series[0] = {column: percent7, filter: {column: 統計類型, eq: 男}}、
          series[1] = {column: percent7, filter: {column: 統計類型, eq: 女}}。
      percent2:
        type: count
        label: 總人口
      percent3:
        type: count
        label: 0-4歲人口
      percent4:
        type: count
        label: 5-9歲人口
      percent5:
        type: count
        label: 10-14歲人口
      percent6:
        type: count
        label: 15-19歲人口
      percent7:
        type: count
        label: 20-24歲人口
        note: 《青年基本法》18-35 歲的起點落在此組距中間，無法直接切出。
      percent8:
        type: count
        label: 25-29歲人口
      percent9:
        type: count
        label: 30-34歲人口
        note: 青年區間常用的最後一個完整組距（30-34）。
      percent10:
        type: count
        label: 35-39歲人口
      percent11:
        type: count
        label: 40-44歲人口
      percent12:
        type: count
        label: 45-49歲人口
      percent13:
        type: count
        label: 50-54歲人口
      percent14:
        type: count
        label: 55-59歲人口
      percent15:
        type: count
        label: 60-64歲人口
      percent16:
        type: count
        label: 65-69歲人口
      percent17:
        type: count
        label: 70-74歲人口
      percent18:
        type: count
        label: 75-79歲人口
      percent19:
        type: count
        label: 80-84歲人口
      percent20:
        type: count
        label: 85-89歲人口
      percent21:
        type: count
        label: 90-94歲人口
      percent22:
        type: count
        label: 95-99歲人口
      percent23:
        type: count
        label: 100歲以上人口
      percent24:
        type: count
        label: 0-14歲人口
        note: 幼年人口。等於 percent3+percent4+percent5。
      percent25:
        type: ratio
        label: 幼年人口佔比(%)
        note: percent24 / percent2 × 100。百分比不可加總。
      percent26:
        type: count
        label: 15-64歲人口
        note: 工作年齡人口。等於 percent6..percent15 加總。
      percent27:
        type: ratio
        label: 工作年齡人口佔比(%)
      percent28:
        type: count
        label: 65歲以上人口
        note: 老年人口。
      percent29:
        type: ratio
        label: 老年人口佔比(%)
      percent30:
        type: ratio
        label: 老年扶養比
        note: percent28 / percent26 × 100。
      percent31:
        type: ratio
        label: 幼年扶養比
        note: percent24 / percent26 × 100。
      percent32:
        type: ratio
        label: 扶養比
        note: percent30 + percent31。
      percent33:
        type: ratio
        label: 老化指數
        note: percent28 / percent24 × 100。臺北 2025 為 190.77。

  youth_fact_named:
    label: 新北市青年統計事實表（統一長表，已帶行政區名）
    city: metrotaipei
    # 長表：同一個 x 有很多列，沒有聚合就會畫出重複的點
    long_table: true
    # 不篩這些欄位會造成重複計算，而且 SQL 不會報錯
    requires_filters: [area_level]
    grain: >-
      一列 = 一個資料集 × 一個指標 × 一個期間 × 一個年齡區間 ×
      一種性別 × 一個地理單位。**這是長表**，同一個行政區有很多列，
      所以一定要填 aggregate，否則同一區會畫出很多個點。
    source: 新北市青年儀表板 ETL（70 個資料集 UNION 而成，外加行政區名對照）
    note: >-
      這張表把 70 個資料集收在同一個結構裡，所以跨領域比較
      （人口 × 就業 × 居住）只是同一張表上的一次 GROUP BY。

      要看哪個指標是用 series[].filter 指定 indicator_id，不是換欄位——
      數值欄位永遠是 value。

      indicator_id 不是全域唯一：有 7 個跨資料集重複，那些必須同時
      指定 dataset_id，否則會把兩份資料的數字加在一起。

      area_level 一定要篩。不篩會讓「全國」「全市」「行政區」三個層級
      的數字混在一起——那是資料重複計算，不是資料豐富。
    fields:
      dataset_id:
        type: category
        label: 資料集代號
        groupable: true
        note: 對應 catalog-youth.yaml 的 youth_datasets
      indicator_id:
        type: category
        label: 指標代號
        groupable: true
        note: 可用的值見 catalog-youth.yaml
      period_start:
        type: date
        label: 期間起
        groupable: true
      period_end:
        type: date
        label: 期間迄
      period_type:
        type: category
        label: 期間型態
        groupable: true
        values: ["year", "calendar_year", "academic_year", "quarter", "month",
                 "half_year", "year_end", "census", "election", "instant",
                 "effective_date", "cumulative_month"]
      age_lower:
        type: count
        label: 年齡下界（含）
        note: 與 age_upper 一起界定組距。18-35 的篩選要用這兩欄，不要用 age_band_raw。
      age_upper:
        type: count
        label: 年齡上界（含）
      age_band_raw:
        type: category
        label: 來源原始的年齡標籤
        note: 僅供顯示與追溯，不要拿來運算——各機關寫法不一致。
      gender:
        type: category
        label: 性別
        groupable: true
        values: ["total", "male", "female", "other", "unknown"]
        neutral_value: "total"
        note: >-
          ⚠ 篩不篩、篩什麼，**一律看該指標的 genders 清單**（在下方指標清單裡）。
          兩種情況會出錯，而且 SQL 都不會報錯：

          情況一：清單有 total ——**必須**篩 gender="total"。
          那些指標同時有 total 與 male／female 三種列，而 total 本身就等於
          男女相加。不篩直接 sum 會重複計算**兩倍**。144 個指標有 58 個是這樣。

          情況二：清單沒有 total（例如生育率只有 female、結婚只有
          male／female）——**不要**放 gender 條件，讓 aggregate 自己加總。
          硬篩 total 會得到空結果。

          要做男女對照時，用 series[].filter 分別指定 male／female，
          不要放進最外層 filters。
      area_name:
        type: category
        label: 行政區名
        groupable: true
        note: >-
          **做分區圖時 x 軸請用這一欄，不要用 area_code。**
          area_code 是數字代碼（65000170），圖表 x 軸顯示出來沒有人看得懂。
          非行政區層級（全國 TW、統計區 A6501-01）沒有對照，會保留原代碼。
      area_code:
        type: category
        label: 地理代碼
        groupable: true
        note: 數字代碼。畫圖用 area_name，這一欄留給需要精確比對的場合。
      area_level:
        type: category
        label: 地理層級
        groupable: true
        values: ["nation", "country", "city", "district", "statistical_area_2"]
        note: 必須篩。不篩會讓不同層級的數字疊加。做分區圖用 district。
      value:
        type: count
        label: 數值
        note: >-
          這一欄的型別其實由該指標的 value_type 決定（見 catalog-youth.yaml）：
          count／sum 可以加總，rate／index／mean／median 只能取平均。
      unit:
        type: category
        label: 單位
      value_type:
        type: category
        label: 數值型態
        groupable: true
        values: ["count", "sum", "rate", "index", "mean", "median"]

  city_age_distribution_taipei:
    label: 臺北市現住人口年齡分配
    city: taipei
    grain: 一列 = 一個行政區 × 一年 × 一種統計類型
    source: 臺北市主計處
    note: >-
      欄位定義與 city_age_distribution_newtaipei **完全相同**，可共用同一份
      欄位說明。唯一差異：合計列的「區域別」叫「總計」，不是「新北市」。
      實測涵蓋 2020-2025 年、12 個行政區。
    same_fields_as: city_age_distribution_newtaipei

  youth_population_district_newtaipei:
    label: 新北市青年人口分區（本專案自建）
    city: metrotaipei
    grain: 一列 = 一個行政區 × 一年 × 一種統計類型
    source: 新北市開放資料平臺「現住人口之年齡分配」
    note: >-
      結構刻意與官方 city_age_distribution_newtaipei 一致，涵蓋 2000-2024 年。
      合計列的區域別是「新北市」。
    same_fields_as: city_age_distribution_newtaipei

